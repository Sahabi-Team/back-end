services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/oklati/sahabi_backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin
      DJANGO_SUPERUSER_PHONE_NUMBER: 09123456789
    env_file: .env
    volumes:
      - ./media:/app/media

  nginx:
    image: nginx:latest 
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ~/nginx-config/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend 

  db:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahabi_db
      POSTGRES_USER: sahabi_user
      POSTGRES_PASSWORD: sahabi_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  
  node-exporter:
    image: prom/node-exporter:master
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"


volumes:
  postgres_data: