name: CD

on:
  push:
    branches:
      - hotfix
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Set TAG environment variable
      run: echo "TAG=latest" >> $GITHUB_ENV

    - name: Generate .env file for Docker Compose
      run: |
        echo "TAG=${TAG}" >> .env
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
        echo "OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE }}" >> .env
        echo "OPENAI_MODEL_NAME=${{ secrets.OPENAI_MODEL_NAME }}" >> .env

    - name: Build Docker Image
      run: |
        docker compose build

    - name: Archive docker context and env
      run: |
        tar -czf deploy.tar.gz .env docker-compose.yaml

    - name: Copy deploy files to server
      uses: appleboy/scp-action@v0.1.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "deploy.tar.gz"
        target: "/home/${{ secrets.SERVER_USER }}/"

    - name: Deploy on server
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /home/${{ secrets.SERVER_USER }}/
          rm -rf back-end || true
          mkdir -p back-end && cd back-end
          tar -xzf ../deploy.tar.gz

          docker compose down || true
          docker compose up -d --build
