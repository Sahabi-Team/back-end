name: CD

on:
  push:
    branches:
      - hotfix
  pull_request:
    branches:
      - develop
    types:
      - closed



jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.TOKEN }}

    - name: Build and Push Docker Image
      run: |
        export IMAGE_TAG=ghcr.io/oklati/sahabi_backend:${{ github.sha }}
        docker build -t $IMAGE_TAG .
        docker push $IMAGE_TAG
    
    - name: Copy files to server via SSH
      uses: appleboy/scp-action@v0.1.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "docker-compose.yaml"
        target: "/home/${{ secrets.SERVER_USER }}/"
    
    - name: Generate .env file for Docker Compose
      run: |
        echo "TAG=${{ github.sha }}" >> .env
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
        echo "OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE }}" >> .env
        echo "OPENAI_MODEL_NAME=${{ secrets.OPENAI_MODEL_NAME }}" >> .env
    
    - name: Copy files to server via SSH
      uses: appleboy/scp-action@v0.1.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "docker-compose.yaml,.env"
        target: "/home/${{ secrets.SERVER_USER }}/"

    - name: Deploy on server
      uses: appleboy/ssh-action@v0.1.8 
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          export TAG=${{ github.sha }}
          cd /home/${{ secrets.SERVER_USER }}/

          echo "${{ secrets.TOKEN }}" | docker login ghcr.io -u ${{ secrets.USERNAME }} --password-stdin

          docker compose pull
          docker compose down
          docker compose up -d
