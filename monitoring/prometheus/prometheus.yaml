global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/rules.yaml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: 
        - cadvisor:8080
  - job_name: 'node_exporter'
    static_configs:
      - targets: 
        - node-exporter:9100